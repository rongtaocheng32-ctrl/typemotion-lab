<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="TypeMotion Lab：Science Gothic 可变字体实验室">
  <title>TypeMotion Lab · 字动实验室</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Science+Gothic:slnt,wdth,wght@-10..0,50..200,100..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <a class="brand" href="#">TYPEMOTION LAB</a>
    <p>Variable Type Playground · 2026</p>
  </header>

  <main>
    <section class="stage">
      <div id="specimen" contenteditable="true" spellcheck="false" aria-label="可编辑字体样张">MOVE<br>THE TYPE</div>
      <p class="hint">点击上方文字可直接编辑</p>
    </section>

    <aside class="panel">
      <div class="panel-head">
        <div>
          <p class="label">LIVE AXES</p>
          <h1>字体控制台</h1>
        </div>
        <button id="random-button" title="随机参数">随机</button>
      </div>

      <label>
        <span>WEIGHT <output id="weight-output">700</output></span>
        <input id="weight" type="range" min="100" max="900" value="700">
      </label>
      <label>
        <span>WIDTH <output id="width-output">100</output></span>
        <input id="width" type="range" min="50" max="200" value="100">
      </label>
      <label>
        <span>SLANT <output id="slant-output">0</output></span>
        <input id="slant" type="range" min="-10" max="0" step="0.5" value="0">
      </label>
      <label>
        <span>SIZE <output id="size-output">128</output></span>
        <input id="size" type="range" min="48" max="190" value="128">
      </label>

      <div class="button-row">
        <button id="animate-button" class="primary">开始呼吸动画</button>
        <button id="copy-button">复制 CSS</button>
      </div>

      <pre id="css-output"></pre>
      <p id="status" role="status"></p>
    </aside>
  </main>

  <footer>
    <span>Typeface: Science Gothic</span>
    <span>Editable · Variable · Open Font</span>
  </footer>
  <script src="app.js"></script>
</body>
</html>
